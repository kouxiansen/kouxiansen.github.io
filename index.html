            .bubble-item {
                position: absolute;
                white-space: nowrap;
                font-size: 14px;
                font-weight: 500;
                color: #333;
                padding: 10px 16px;
                border-radius: 20px;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
                animation: bubble-animation cubic-bezier(0.4, 0, 0.2, 1) forwards;
                max-width: 200px;
            }
            
            .bubble-item::after {
                content: '';
                position: absolute;
                bottom: -6px;
                left: 20px;
                width: 0;
                height: 0;
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
            }
            
            .bubble-color-1 {
                background: #E3F2FD;
            }

            @keyframes bubble-animation {

                }

                image: "./images/photo (15).webp"
            },
            {
                id: 16,
                title: "简历模板",
                author: "达维德·托姆奇克",
                likes: 132,
                views: 2.5,
                isPro: false,
                category: "海报设计",
                image: "./images/photo (16).webp"
            },
            {
                id: 17,
                title: "网页设计概念",
                author: "赛义德·伊斯兰",
                likes: 167,
                views: 3.4,
                isPro: true,
                category: "海报设计",
                image: "./images/photo (17).webp"
            },
            {
                id: 18,
                title: "日历应用",
                author: "斯捷潘·波波夫",
                likes: 123,
                views: 2.2,
                isPro: false,
                category: "包装设计",
                image: "./images/photo (18).webp"
            }
        ];

        // DOM 元素
        const portfolioGrid = document.getElementById('portfolio-grid');
        const loading = document.getElementById('loading');
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const categoryNav = document.getElementById('category-nav');

        // 当前选中的分类
        let currentFilter = 'all';

        // 初始化页面
        function init() {
            renderPortfolioItems(portfolioItems);
            setupEventListeners();
            setupInfiniteScroll();
            setupCategoryFilter();
        }

        // 渲染作品项
        function renderPortfolioItems(items) {
            // 清空现有内容
            portfolioGrid.innerHTML = '';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = "card-hover rounded-lg overflow-hidden shadow-sm bg-white cursor-pointer portfolio-card";
                card.setAttribute('data-category', item.category);
                card.innerHTML = `
                    <div class="relative h-48 overflow-hidden">
                        <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
                        ${item.isPro ? '<div class="absolute top-2 right-2 bg-primary text-white text-xs px-2 py-1 rounded-full">PRO</div>' : ''}
                    </div>
                    <div class="p-3">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs text-gray-500">${item.category}</span>
                            <div class="flex items-center space-x-2">
                                <div class="flex items-center">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                    </svg>
                                    <span class="text-xs text-gray-500 ml-1">${item.likes}</span>
                                </div>
                                <div class="flex items-center">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                                    </svg>
                                    <span class="text-xs text-gray-500 ml-1">${item.views}k</span>
                                </div>
                            </div>
                        </div>
                        <p class="font-medium text-sm mb-1">${item.title}</p>
                        <div class="flex items-center">
                            <div class="w-5 h-5 rounded-full bg-gray-200 mr-2"></div>
                            <span class="text-xs text-gray-600">${item.author}</span>
                        </div>
                    </div>
                `;
                // 添加点击事件
                card.addEventListener('click', () => {
                    window.location.href = `detail-${item.id}.html`;
                });
                portfolioGrid.appendChild(card);
            });
        }

        // 设置分类筛选功能
        function setupCategoryFilter() {
            if (!categoryNav) return;

            const navItems = categoryNav.querySelectorAll('.nav-item');

            navItems.forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();

                    // 获取筛选类型
                    const filter = item.getAttribute('data-filter');
                    currentFilter = filter;

                    // 更新选中态
                    navItems.forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');

                    // 筛选作品
                    filterPortfolio(filter);
                });
            });
        }

        // 筛选作品
        function filterPortfolio(category) {
            const cards = portfolioGrid.querySelectorAll('.portfolio-card');

            cards.forEach(card => {
                const cardCategory = card.getAttribute('data-category');

                if (category === 'all' || cardCategory === category) {
                    // 显示卡片
                    card.style.display = 'block';
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.95)';

                    // 平滑显示动画
                    setTimeout(() => {
                        card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                        card.style.opacity = '1';
                        card.style.transform = 'scale(1)';
                    }, 50);
                } else {
                    // 隐藏卡片
                    card.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                    card.style.opacity = '0';
                    card.style.transform = 'scale(0.95)';

                    setTimeout(() => {
                        card.style.display = 'none';
                    }, 300);
                }
            });
        }

        // 设置事件监听器
        function setupEventListeners() {
            // 移动端菜单切换
            menuToggle.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // 设置无限滚动
        function setupInfiniteScroll() {
            window.addEventListener('scroll', () => {
                if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 1000) {
                    loadMoreItems();
                }
            });
        }

        // 加载更多作品 - 已禁用，只显示18张固定卡片
        function loadMoreItems() {
            // 不再加载更多内容，只保留初始的18张卡片
            return;
        }

        // 对话泡泡弹幕功能
        function initBubbleDanmaku() {
            const container = document.getElementById('bubble-container');
            const wrapper = document.getElementById('bubble-wrapper');
            
            // 自定义弹幕内容 - 可在此修改
            const bubbleTexts = [
                '欢迎来到我的作品集✨',
                '感谢你的观看😊',
                '喜欢就点个赞吧👍',
                '持续更新中📸',
                '欢迎合作💼',
                '优质作品持续输出🎨',
                '谢谢你的支持💕',
                '希望你喜欢这些作品🌟',
                '有任何问题请联系我📩',
                '新作品即将上线🚀'
            ];
            
            // 弹幕配置
            const config = {
                animationDuration: 8, // 动画持续时间（秒）
                interval: 3000, // 弹幕发射间隔（毫秒）
                maxBubbles: 4, // 最大同时显示的泡泡数量
                containerHeight: 60 // 容器高度（像素）
            };
            
            // 颜色类名
            const bubbleColors = ['bubble-color-1', 'bubble-color-2', 'bubble-color-3', 'bubble-color-4', 'bubble-color-5'];
            
            // 当前活跃的泡泡
            const activeBubbles = [];
            
            // 生成随机弹幕
            function createBubble() {
                // 限制同时显示的泡泡数量
                if (activeBubbles.length >= config.maxBubbles) {
                    return;
                }
                
                const text = bubbleTexts[Math.floor(Math.random() * bubbleTexts.length)];
                const bubble = document.createElement('div');
                
                // 随机颜色
                const colorClass = bubbleColors[Math.floor(Math.random() * bubbleColors.length)];
                bubble.className = `bubble-item ${colorClass}`;
                bubble.textContent = text;
                
                // 随机水平位置（左侧10%-90%）
                const left = Math.random() * 80 + 10;
                bubble.style.left = `${left}%`;
                
                // 随机垂直位置（上方10%-70%）
                const top = Math.random() * 50 + 10;
                bubble.style.top = `${top}px`;
                
                // 随机动画时长
                const duration = config.animationDuration + Math.random() * 2;
                bubble.style.animationDuration = `${duration}s`;
                
                wrapper.appendChild(bubble);
                activeBubbles.push(bubble);
                
                // 动画结束后移除元素
                bubble.addEventListener('animationend', () => {
                    bubble.remove();
                    const index = activeBubbles.indexOf(bubble);
                    if (index > -1) {
                        activeBubbles.splice(index, 1);
                    }
                });
            }
            
            // 持续生成弹幕
            setInterval(createBubble, config.interval);
            
            // 初始生成一批弹幕
            for (let i = 0; i < 2; i++) {
                setTimeout(createBubble, i * 1500);
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            init();
            initBubbleDanmaku();
        });
    </script>
</body>
</html>
